[package]
name = "lisek-plugin-anisearch"
description = "aniSearch anime metadata provider extension for LisekMovie (skeleton)."
version = "1.0.0-beta"
edition = "2024"
license = "MIT"
repository = "https://github.com/LisekMovieApp/LisekMovie-plugin-anisearch"

[dependencies]
lisek-plugin-api = { path = "../LisekMovie-app/LisekMovie-Backend/lisek-plugin-api" }
async-trait = "0.1.89"
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
